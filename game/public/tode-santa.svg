        <!-- SANTA SUIT.
             Drawn over the frog rather than replacing him: the green head,
             hands and the mouth all stay exactly as they are in tode.svg.
             Band order down the figure is white brim / green face / white
             beard / red coat / black belt / red / white fur / black boots,
             so no two red bands ever touch. -->

        <!-- Sleeves, under the coat body: the arms run right out to the
             edge of the figure, so these are wider than the torso. -->
        <rect fill="#e3272f" height="25" rx="5" width="120" x="90" y="163"/>
        <!-- Coat. -->
        <rect fill="#e3272f" height="33.5" rx="13" width="102" x="99" y="150.5"/>
        <!-- The belly. In 3D this is a silhouette change and that is the
             whole point of it; flat and head-on there is nowhere for it to
             bulge, because the arms already set the outer edge. So here it
             is carried by a lighter red instead. The model must not copy
             that: on the model it is shape, not shading. -->
        <ellipse cx="150" cy="164" fill="#ef4049" rx="54" ry="15"/>

        <!-- Belt, with the buckle inset. Sits below the belly's widest
             point, not across it, so the belly still overhangs it. -->
        <rect fill="#000" height="10" rx="2" width="106" x="97" y="169"/>
        <rect fill="#f2c14e" height="13" rx="2.5" width="16" x="142" y="167.5"/>
        <rect fill="#e3272f" height="5" rx="1" width="6" x="147" y="171.5"/>

        <!-- One white band doing three jobs: the coat's fur hem across the
             middle and a cuff on each sleeve where it reaches the hands. -->
        <rect fill="#fff" height="6.5" rx="3.2" width="120" x="90" y="184"/>

        <!-- Boots, on the frog's own foot shapes. -->
        <path d="m124.95 190.093h-29.897c-2.7907 0-5.053 2.263-5.053 5.053v3.108c0 2.791 2.2623 5.053 5.053 5.053h29.897c2.791 0 5.053-2.262 5.053-5.053v-3.108c0-2.79-2.262-5.053-5.053-5.053z"
              fill="#000"/>
        <path d="m204.847 190.093h-29.821c-2.791 0-5.053 2.263-5.053 5.053v3.108c0 2.791 2.262 5.053 5.053 5.053h29.821c2.79 0 5.053-2.262 5.053-5.053v-3.108c0-2.79-2.263-5.053-5.053-5.053z"
              fill="#000"/>
        <!-- Hands, repainted green over the boots they overlap: bare rather
             than mittened, so there is green low on the figure as well as at
             the face. -->
        <path d="m131.898 190.107h-10.148c-2.79 0-5.053 2.262-5.053 5.053v3.049c0 2.79 2.263 5.053 5.053 5.053h10.148c2.791 0 5.053-2.263 5.053-5.053v-3.049c0-2.791-2.262-5.053-5.053-5.053z"
              fill="#21d789"/>
        <path d="m167.858 203.254h10.359c2.79 0 5.053-2.263 5.053-5.053v-3.049c0-2.791-2.263-5.053-5.053-5.053h-10.359c-2.791 0-5.053 2.262-5.053 5.053v3.049c0 2.79 2.262 5.053 5.053 5.053z"
              fill="#21d789"/>

        <!-- Beard, kept short: the mouth above it has to stay the widest
             shape on the face, because the mouth is what carries the smile. -->
        <path d="m118 150h64v5c0 6.6-14.3 12-32 12s-32-5.4-32-12z" fill="#fff"/>

        <!-- Hat: cone, fur brim, pompom. -->
        <path d="m102 89c3-16 36-28 86-30 5 9 5 20 8 30z" fill="#e3272f"/>
        <rect fill="#fff" height="13" rx="6.5" width="104" x="99" y="87"/>
        <circle cx="190" cy="56" fill="#fff" r="9"/>
    </g>

